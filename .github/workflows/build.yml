name: build

# Собирает HIKA на настоящей Windows. Нужно потому, что разработка ведётся
# не на Windows — этот прогон ловит ошибки компиляции до того, как до них
# дойдёт живой человек.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Восстановить пакеты
        run: dotnet restore HIKA.sln

      - name: Собрать (Release)
        run: dotnet build HIKA.sln -c Release --no-restore -warnaserror:false

      # Проверяют разбор русских команд: транслитерацию, слово пробуждения,
      # каталог, отсев выдумок распознавателя. Микрофон и экран не нужны,
      # поэтому это единственная часть, которую вообще можно проверить в CI.
      - name: Прогнать тесты
        run: dotnet test tests/Hika.Tests/Hika.Tests.csproj -c Release --no-build --verbosity normal

      - name: Опубликовать
        run: dotnet publish src/Hika.App/Hika.App.csproj -c Release -o artifacts/hika --no-restore

      - name: Выложить сборку
        uses: actions/upload-artifact@v4
        with:
          name: hika-win-x64
          path: artifacts/hika
          retention-days: 14
