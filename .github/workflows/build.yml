name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Разбор русских команд: транслитерация, слово пробуждения, каталог,
  # отсев выдумок распознавателя. Ни микрофона, ни экрана не требует,
  # поэтому идёт отдельной быстрой задачей и не ждёт сборки под Windows.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Прогнать тесты
        run: dotnet test tests/Hika.Tests/Hika.Tests.csproj -c Release --verbosity normal

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Восстановить пакеты
        run: dotnet restore HIKA.sln

      - name: Собрать (Release)
        run: dotnet build HIKA.sln -c Release --no-restore -warnaserror:false -p:SourceRevisionId=${{ github.sha }}

      - name: Опубликовать
        run: dotnet publish src/Hika.App/Hika.App.csproj -c Release -o artifacts/hika --no-restore -p:SourceRevisionId=${{ github.sha }}

      - name: Выложить сборку
        uses: actions/upload-artifact@v4
        with:
          name: hika-win-x64
          path: artifacts/hika
          retention-days: 14
